        - Mathematischen Angriff mittels Korrelationsmatrix-Eigenwertzerlegung zur Berechnung von Winkelprojektionsvektoren P = (y_max^T U) y_max formuliert.
        - Top-k% selektives Masking mit Gradient-Rise zur Wahrung der Stealthiness und Vermeidung von Angriffsdämpfung über Multi-Hop-Mittelung entwickelt.
        - Verteilte PyTorch-Simulation auf GPU-Clustern gebaut; CNN/MLP-Modelle auf CIFAR-10, MNIST und Fashion-MNIST über Mesh-, Stern- und Ringnetze getestet.
        - Konsistente Degradierung der benignen F1-Werte auf <0,1 gegen 4 byzantinisch-robuste Regeln (FedAvg, Krum, Trimmed Mean, Median) nachgewiesen.
      keywords:
        - PyTorch
