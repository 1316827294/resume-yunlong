    - name: "DMPA: Adversarial Robustness in dezentralem FL"
      description: Neuartiger Model-Poisoning-Angriff und Sicherheitsbenchmark für dezentrales föderiertes Lernen (arXiv:2502.04771).
      url: https://arxiv.org/abs/2502.04771
      startDate: Jan 2024
